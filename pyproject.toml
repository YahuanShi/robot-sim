[project]
name = "robot-sim"
version = "0.1.0"
description = "Shared Franka Panda simulation (robosuite + robomimic) for imitation-learning reimplementations"
requires-python = ">=3.10,<3.11"
dependencies = [
    "robosuite==1.5.1",  # 1.5.2 pins mink==0.0.5 → numpy<2, clashing with lerobot
    "mujoco>=3.3,<3.9",  # robosuite 1.5.1 breaks on newer mujoco
    "numpy",
    "h5py",
    "gymnasium>=1.0",
    "imageio",
    "imageio-ffmpeg",
    "tqdm",
]

[project.optional-dependencies]
# LeRobot v3 conversion (pulls in torch); the policy repos already have it
convert = ["lerobot>=0.4,<0.5"]
dev = ["pytest"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu118", marker = "platform_system == 'Linux'" }]
torchvision = [{ index = "pytorch-cu118", marker = "platform_system == 'Linux'" }]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robot_sim"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["robot_sim"]
